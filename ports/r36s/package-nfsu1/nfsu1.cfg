# NFSU1 settings, read by NFSU1.sh at launch.
# Frame cap: 30 or 60
NFSU1_FPS=30
# Language: English | Spanish | French | German | Italian | Dutch | Swedish
NFSU1_LANG=English
# Frame counter from the start (Select + R3 toggles it in game)
#NFSU2_SHOW_FPS=1
# Music (your own OGG/MP3 files): nfsu1/music/menu for the menus, nfsu1/music/race for races.
# Volume 0-100 (0 turns it off). Select + R1 skips to the next track.
NFSU1_MUSIC_VOLUME=70
# 1 = random order, 0 = by file name
NFSU1_MUSIC_SHUFFLE=1
